<!doctype html>
<html lang="it" data-profilo="F">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frappaula Lei" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" />
    <title>Frappaula Fit · Lei</title>
    <script>
      // Tema salvato applicato prima del primo disegno; col chiaro la barra di stato dell'iPhone ha il testo scuro.
      try {
        if (localStorage.getItem('frappaula-lei-tema') === 'chiaro') {
          document.documentElement.setAttribute('data-tema', 'chiaro');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f2');
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
