<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frappaula" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" />
    <title>Frappaula Fit</title>
    <script>
      // Tema e accento salvati (§12c) applicati prima del primo disegno. Con il tema chiaro la barra di stato
      // dell'iPhone usa il testo scuro: iOS legge questa impostazione all'apertura dell'app.
      try {
        var t = localStorage.getItem('frappaula-tema');
        var p = localStorage.getItem('frappaula-profilo');
        if (t === 'chiaro') {
          document.documentElement.setAttribute('data-tema', 'chiaro');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f2');
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
        if (p === 'F') document.documentElement.setAttribute('data-profilo', 'F');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
